<style>
:root{color-scheme:dark;
  --plane:#0e1012; --card:#191c1f; --ink:#eef1f3; --ink-2:#a9b2b8; --ink-3:#7d868d;
  --line:#282d32; --accent:#c79a62; --accent-soft:rgba(199,154,98,.14); --crit:#e06767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 44px -28px rgba(0,0,0,.95);}
:root[data-ui="light"]{color-scheme:light;
  --plane:#f1f3f5; --card:#fbfcfd; --ink:#0f1315; --ink-2:#576067; --ink-3:#868f96;
  --line:#e0e5e9; --accent:#8a6236; --accent-soft:rgba(138,98,54,.10); --crit:#a72d2d;
  --shadow:0 1px 2px rgba(15,19,21,.05), 0 18px 44px -28px rgba(15,19,21,.5);}}
:root[data-theme="dark"]{color-scheme:dark;
  --plane:#0e1012; --card:#191c1f; --ink:#eef1f3; --ink-2:#a9b2b8; --ink-3:#7d868d;
  --line:#282d32; --accent:#c79a62; --accent-soft:rgba(199,154,98,.14); --crit:#e06767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 44px -28px rgba(0,0,0,.95);}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh; display:grid; place-items:center; padding:24px;
  background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:15px}
.gate{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:30px 28px 26px}
.logo{display:block; color:var(--ink); opacity:.92; margin-bottom:18px}
h1{font-family:"IBM Plex Serif", Georgia, serif; font-size:21px; font-weight:600; margin:0}
p.sub{margin:7px 0 22px; font-size:13.5px; color:var(--ink-2); line-height:1.5}
label{display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:7px}
input[type=password]{width:100%; font:inherit; padding:11px 13px; border-radius:9px;
  border:1px solid var(--line); background:var(--plane); color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.remember{display:flex; align-items:center; gap:8px; margin-top:13px; font-size:13px; color:var(--ink-2)}
button{width:100%; margin-top:18px; font:inherit; font-weight:500; padding:11px 14px; border:0;
  border-radius:9px; background:var(--accent); color:#fff; cursor:pointer}
button:hover{filter:brightness(1.08)}
button[disabled]{opacity:.6; cursor:default}
.err{margin-top:13px; font-size:13px; color:var(--crit); min-height:19px}
.hint{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  font-size:12px; color:var(--ink-3); line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const err=document.getElementById("err"), go=document.getElementById("go");
async function attempt(pw, silent){
  go.disabled=true; err.textContent = silent ? "" : "Расшифровываем…";
  try{ const html=await open_(pw);
       if(document.getElementById("rm").checked) try{localStorage.setItem("svetpam_pw",pw)}catch(e){}
       show(html);
  }catch(e){
    try{localStorage.removeItem("svetpam_pw")}catch(_){}
    err.textContent = silent ? "" : "Пароль не подошёл. Проверьте раскладку и регистр.";
    go.disabled=false;
  }
}
document.getElementById("gate").addEventListener("submit",ev=>{
  ev.preventDefault();
  const v=document.getElementById("pw").value.trim();
  if(!v){ err.textContent="Введите пароль."; return; }
  attempt(v,false);
});
if(!(window.crypto && crypto.subtle)){
  err.textContent="Страница открыта не по HTTPS — расшифровка недоступна. Откройте адрес с https://";
  go.disabled=true;
} else {
  let saved=null; try{ saved=localStorage.getItem("svetpam_pw"); }catch(e){}
  if(saved) attempt(saved,true);
}
})();
</script>
